appId: com.generalgroovy.sendit
productName: Send It
directories:
  output: dist
  buildResources: desktop
files:
  - desktop/main.cjs
  - desktop/resources.cjs
  - desktop/icon.png
  - desktop/build.json
  - src/**
  - assets/**
  - generated/**
  - index.html
  - playtest.html
  - playtest.css
  - map-data.html
  - package.json
  - '!node_modules/**'
asar: true
npmRebuild: false
beforePack: ./desktop/before-pack.cjs
electronLanguages: [en-US, de]
win:
  icon: desktop/icon.ico
  executableName: Send It
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Send-It-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
portable:
  artifactName: Send-It-${version}-Windows-Portable.${ext}
  requestExecutionLevel: user
