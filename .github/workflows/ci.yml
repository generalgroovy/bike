name: Test

on:
  push:
    branches: [main, feature/berlin-playtest]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Verify official building detail packs
        run: node tools/validate-building-details.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native browser acceptance
        run: python e2e/browser_smoke.py
      - name: Berlin playtest acceptance
        run: python e2e/playtest_smoke.py
      - name: Full city acceptance and saved shifts
        run: python e2e/city_smoke.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-it-browser-evidence
          path: reports/browser/
          retention-days: 7
          if-no-files-found: warn
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked build tools
        run: npm ci
      - name: Build bundled Windows applications
        run: npm run app:windows
      - name: Test packaged app offline and across restarts
        run: node desktop/smoke.mjs "dist/win-unpacked/Send It.exe"
      - name: Upload Windows apps and native acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-it-windows-app
          path: |
            dist/*.exe
            reports/desktop/
            desktop/build.json
          retention-days: 14
          if-no-files-found: error
  preview:
    needs: [test, browser, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
      - name: Package tested source and offline preview
        run: |
          mkdir -p "$RUNNER_TEMP/send-it-preview"
          git archive --format=tar HEAD > "$RUNNER_TEMP/send-it-preview/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/send-it-preview/COMMIT.txt"
      - name: Upload tested preview
        uses: actions/upload-artifact@v4
        with:
          name: send-it-tested-preview
          path: ${{ runner.temp }}/send-it-preview/
          retention-days: 7
          if-no-files-found: error
